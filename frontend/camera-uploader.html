<!doctype html>
<html>
  <body>
    <h2>Webcam Stream Uploader</h2>
    <label>Camera ID: <input id="camid" value="cam1" /></label>
    <button id="toggle-stream">Start Streaming</button>
    <video id="video" autoplay playsinline style="display: none"></video>
    <script>
      let ws;
      let wsCamId = null;
      let wsInterval = null;
      let wsStream = null;
      let wsVideo = document.getElementById("video");
      let isStreaming = false;
      const toggleBtn = document.getElementById("toggle-stream");

      function startWebSocket(camid) {
        if (ws) ws.close();
        ws = new WebSocket(
          `wss://mock-cctv.onrender.com/upload/${encodeURIComponent(camid)}`,
        );
        wsCamId = camid;
        ws.onclose = () => {
          if (isStreaming) {
            // Try to reconnect after 1s
            setTimeout(() => startWebSocket(wsCamId), 1000);
          }
        };
      }

      function startStreaming() {
        const camid = document.getElementById("camid").value || "cam1";
        startWebSocket(camid);
        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
          wsVideo.srcObject = stream;
          wsStream = stream;
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          if (wsInterval) clearInterval(wsInterval);
          wsInterval = setInterval(() => {
            if (wsVideo.videoWidth && ws.readyState === 1) {
              canvas.width = wsVideo.videoWidth;
              canvas.height = wsVideo.videoHeight;
              ctx.drawImage(wsVideo, 0, 0);
              canvas.toBlob(
                (blob) => {
                  if (ws.readyState === 1)
                    blob.arrayBuffer().then((buf) => ws.send(buf));
                },
                "image/jpeg",
                0.7,
              );
            }
          }, 200); // 5 fps
        });
        isStreaming = true;
        toggleBtn.textContent = "Stop Streaming";
      }

      function stopStreaming() {
        isStreaming = false;
        toggleBtn.textContent = "Start Streaming";
        if (wsInterval) {
          clearInterval(wsInterval);
          wsInterval = null;
        }
        if (ws) {
          ws.onclose = null;
          ws.close();
          ws = null;
        }
        if (wsStream) {
          wsStream.getTracks().forEach((track) => track.stop());
          wsStream = null;
        }
        wsVideo.srcObject = null;
      }

      toggleBtn.onclick = () => {
        if (!isStreaming) {
          startStreaming();
        } else {
          stopStreaming();
        }
      };
    </script>
  </body>
</html>
